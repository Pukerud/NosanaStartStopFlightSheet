#!/bin/bash

# Use BASH_SOURCE[0] to reliably get the directory where this script is located.
# This is more robust than `dirname "$0"` or using environment variables.
DIR_NAME=$(dirname "${BASH_SOURCE[0]}")

# Set execute permissions on the other scripts using the discovered path.
# We suppress errors and use '|| true' to prevent script failure if we don't own the files (e.g., if installed by root but run by user).
# HiveOS usually handles execution permissions, but this is a fallback for manually zipped archives.
chmod +x "$DIR_NAME/h-run.sh" 2>/dev/null || true
chmod +x "$DIR_NAME/h-stats.sh" 2>/dev/null || true
chmod +x "$DIR_NAME/h-config.sh" 2>/dev/null || true

# Define miner variables for HiveOS.
CUSTOM_NAME="NosanaFlight"
CUSTOM_LOG_BASENAME="/var/log/nosana-flight-sheet"
